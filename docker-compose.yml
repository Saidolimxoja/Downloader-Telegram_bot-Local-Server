services:
  postgres:
    image: postgres:16-alpine
    container_name: tg_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для очередей
  redis:
    image: redis:7-alpine
    container_name: tg_bot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly no --save ""
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Локальный Telegram Bot API server (снимает лимит 50 МБ на отправку файлов).
  # Профиль local-api: поднимается ТОЛЬКО при `docker compose --profile local-api up -d`
  # (dev на Windows). На VPS telegram-bot-api собран и запущен на хосте —
  # там профиль не указываем, и этот контейнер не создаётся.
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    profiles: ["local-api"]
    restart: always
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    networks:
      - bot-network

  # NestJS Application
  nest-bot:
    build: .
    container_name: nest_bot
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # telegram-api намеренно НЕ в depends_on: на VPS этого сервиса нет,
    # жёсткая зависимость сломала бы там запуск.
    extra_hosts:
      # Даёт контейнеру доступ к сервисам на хосте VPS (telegram-bot-api под systemd)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./downloads:/app/downloads
      - ./youtube_cookies.txt:/app/youtube_cookies.txt
    ports:
      - "3000:3000"
    networks:
      - bot-network
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bot_db
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/bot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # dev (Windows, профиль local-api) — контейнер telegram-api по имени сервиса.
      # prod (VPS) — задай в .env: API_URL=http://host.docker.internal:8081
      - API_URL=${API_URL:-http://telegram-api:8081}

# Описываем тома
volumes:
  postgres_data:
  redis_data:
  bot_downloads:
  telegram-data:

# Создаем сеть для контейнеров
networks:
  bot-network:
    driver: bridge
