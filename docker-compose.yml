services:
  postgres:
    image: postgres:16-alpine
    container_name: tg_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bot-network
    # Пул соединений: бот плюс несколько воркеров, каждый со своим пулом
    # Prisma. Дефолтных 100 хватает, но лучше задать явно и осознанно.
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tg_bot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # appendonly включён намеренно: в Redis теперь лежат не только очереди,
    # но и сессии видео с кнопками. Терять их при рестарте не хочется.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Локальный Telegram Bot API server (снимает лимит 50 МБ на отправку).
  # Профиль local-api: поднимается только при
  #   docker compose --profile local-api up -d
  # На VPS telegram-bot-api собран и запущен на хосте — профиль не указываем.
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    profiles: ["local-api"]
    restart: always
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    networks:
      - bot-network

  # ============================================================
  #  ПРОЦЕСС БОТА — принимает сообщения, ставит задачи в очередь.
  #  Всегда ровно один: long-polling с одним токеном не терпит дублей.
  # ============================================================
  bot:
    build: .
    container_name: nest_bot
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - downloads:/app/downloads
      - ./youtube_cookies.txt:/app/youtube_cookies.txt:ro
    ports:
      # Только на localhost: /metrics показывает состояние очередей и памяти,
      # наружу его отдавать незачем. Публичный доступ к /r/* даёт Caddy.
      - "127.0.0.1:3000:3000"
    networks:
      - bot-network
    environment:
      - ROLE=bot
      - PUBLIC_URL=${PUBLIC_URL:-}
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bot_db?connection_limit=10&pool_timeout=20
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/bot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_URL=${API_URL:-http://telegram-api:8081}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ============================================================
  #  ВОРКЕРЫ — качают, перекодируют, заливают.
  #  Масштабируются числом реплик:  docker compose up -d --scale worker=4
  # ============================================================
  worker:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot:
        # Ждём бота: он накатывает миграции, воркеру нужна готовая схема
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - downloads:/app/downloads
      - ./youtube_cookies.txt:/app/youtube_cookies.txt:ro
    networks:
      - bot-network
    environment:
      - ROLE=worker
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bot_db?connection_limit=10&pool_timeout=20
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_URL=${API_URL:-http://telegram-api:8081}
      # Порт внутри контейнера один и тот же, наружу не публикуем —
      # иначе реплики подрались бы за него
      - PORT=3000
    deploy:
      replicas: 2
      resources:
        limits:
          # ffmpeg охотно съест все ядра; ограничиваем, чтобы воркеры
          # не задушили друг друга и базу
          cpus: "2"
          memory: 2G

  # ============================================================
  #  HTTPS для отслеживания переходов по рекламе.
  #  Профиль public: поднимается только при
  #    docker compose --profile public up -d
  #  Если на сервере уже стоит nginx — не включайте профиль, он займёт
  #  порты 80 и 443. Тогда настройте проксирование /r/* в своём nginx.
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: bot_caddy
    profiles: ["public"]
    restart: always
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      # Домен для выпуска сертификата — задаётся в .env.
      # Значение по умолчанию намеренно безобидное: обязательная проверка
      # (${DOMAIN:?...}) ломала бы ЛЮБУЮ команду docker compose, даже когда
      # профиль public не используется — compose разбирает весь файл целиком.
      DOMAIN: ${DOMAIN:-localhost}
    networks:
      - bot-network

  # ============================================================
  #  CLOUDFLARE TUNNEL — публичный HTTPS без белого IP.
  #  Профиль tunnel:
  #    docker compose --profile tunnel up -d
  #
  #  Для домашнего или офисного компьютера за NAT, где нет доступа к
  #  роутеру. cloudflared сам устанавливает исходящее соединение с
  #  Cloudflare — проброс портов и открытые 80/443 не нужны.
  #
  #  Профили public и tunnel взаимоисключающие: либо свой сертификат
  #  на своём IP, либо туннель. Одновременно включать не нужно.
  # ============================================================

  # Фильтр маршрутов перед туннелем. Порты наружу не публикуются —
  # контейнер виден только внутри сети docker.
  edge:
    image: caddy:2-alpine
    container_name: bot_edge
    profiles: ["tunnel"]
    restart: always
    depends_on:
      - bot
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    networks:
      - bot-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bot_cloudflared
    profiles: ["tunnel"]
    restart: always
    depends_on:
      - edge
    # --no-autoupdate: обновление образа — задача docker, а не процесса
    # внутри контейнера, который при этом молча перезапускается
    command: tunnel --no-autoupdate run
    environment:
      # Токен туннеля из панели Cloudflare Zero Trust. Секрет — держите
      # его в .env, файл не попадает в git.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - bot-network

volumes:
  postgres_data:
  redis_data:
  telegram-data:
  caddy_data:
  caddy_config:
  caddy_logs:
  # Общий том для загрузок: воркер пишет файл, он же его и отправляет,
  # но при общей папке проще чистить мусор одним кроном
  downloads:

networks:
  bot-network:
    driver: bridge
